### Merge the dev-selected 8B SFT adapter into its base: saves/onerec-8b/sft-merged is the
### RLVR initializer and the OPD teacher. Adapters are not released; point adapter_name_or_path at
### your own dev-selected checkpoint (the paper's is checkpoint-88).
###   llamafactory-cli export code/sft/configs/merge-onerec-8b.yaml
###   python code/utils/model_config.py saves/onerec-8b/sft-merged
model_name_or_path: OpenOneRec/OneRec-8B-Pro
model_revision: 17b594d1e6b322752d939a769a07860f7e4a0261
adapter_name_or_path: saves/onerec-8b/sft/checkpoint-88
template: qwen3
trust_remote_code: true
finetuning_type: lora

export_dir: saves/onerec-8b/sft-merged
export_size: 5
export_device: cpu
export_legacy_format: false
