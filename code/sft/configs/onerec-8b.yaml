### SFT of OneRec-8B-Pro on the SID-only teacher traces (paper Sec. 5, Table C.2).
### LoRA r=16 on all linear layers, effective batch 128, lr 5e-5 cosine, 3-epoch horizon,
### checkpoints every ~0.5 epoch; the paper selects checkpoint-88 (epoch 1.01) on dev NDCG@5.
###   bash code/sft/train.sh code/sft/configs/onerec-8b.yaml
model_name_or_path: OpenOneRec/OneRec-8B-Pro
model_revision: 17b594d1e6b322752d939a769a07860f7e4a0261
trust_remote_code: true

stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_target: all

dataset: sft_train
eval_dataset: sft_dev
dataset_dir: data/sft
template: qwen3
cutoff_len: 4096
preprocessing_num_workers: 8

output_dir: saves/onerec-8b/sft
logging_steps: 5
save_strategy: steps
save_steps: 0.1667
plot_loss: true

# train.sh sets gradient_accumulation_steps from the GPU count (effective batch 128).
per_device_train_batch_size: 4
gradient_accumulation_steps: 8
learning_rate: 5.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.08
weight_decay: 0.0
bf16: true

per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 0.1667

report_to: none
run_name: onerec-8b-sft
