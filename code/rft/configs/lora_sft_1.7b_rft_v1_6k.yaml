### Final RFT v1 1.7B Pro arm: continue the frozen SFT-v3 checkpoint 1035
### on its own verifier-accepted rollouts from the shared 6k prompt subset.
### Dev loss is diagnostic; benchmark dev NDCG@5 selects the checkpoint.
### Launch from repository root in sid-lf:
###   EFF_BATCH=32 bash code/sft/train.sh code/rft/configs/lora_sft_1.7b_rft_v1_6k.yaml
model_name_or_path: OpenOneRec/OneRec-1.7B-pro
model_revision: 5dc1b097ab8194f48f14730e5400a276a22f4ca1
adapter_name_or_path: saves/onerec-1.7b-pro/lora/sft_v3_12k_lr1e4/checkpoint-1035
trust_remote_code: true

stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_target: all

dataset: rft_train
eval_dataset: sft_dev
dataset_dir: data/rft_v1_6k
template: qwen3
cutoff_len: 8192
preprocessing_num_workers: 8

output_dir: saves/onerec-1.7b-pro/lora/rft_v1_6k
logging_steps: 5
save_strategy: steps
save_steps: 0.25
plot_loss: true

per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 5.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true

per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 0.25

report_to: wandb
run_name: rft_v1_1.7b_6k
