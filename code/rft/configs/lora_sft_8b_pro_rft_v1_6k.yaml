### Final RFT v1 8B Pro arm. Continue the dev-selected SFT-v3 checkpoint 88
### on verifier-accepted rollouts generated by that same Pro policy over the
### same shared 6k prompt keys as the 1.7B Pro arm.
### Launch from repository root in sid-lf:
###   EFF_BATCH=32 bash code/sft/train.sh code/rft/configs/lora_sft_8b_pro_rft_v1_6k.yaml
model_name_or_path: OpenOneRec/OneRec-8B-Pro
model_revision: 17b594d1e6b322752d939a769a07860f7e4a0261
adapter_name_or_path: saves/onerec-8b-pro/lora/hp_e128_lr5e5/checkpoint-88
trust_remote_code: true

stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_target: all

dataset: rft_train
eval_dataset: sft_dev
dataset_dir: data/rft_v1_8b_pro_e128_lr5e5_6k
template: qwen3
cutoff_len: 8192
preprocessing_num_workers: 8

output_dir: saves/onerec-8b-pro/lora/rft_v1_8b_pro_e128_lr5e5_6k
logging_steps: 5
save_strategy: steps
save_steps: 0.25
plot_loss: true

per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 5.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true

per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 0.25

report_to: wandb
run_name: rft_v1_8b_pro_e128_lr5e5_6k
